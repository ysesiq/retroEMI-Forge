buildscript {
	repositories {
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath 'com.modrinth.minotaur:Minotaur:2.4.3'
		classpath 'gradle.plugin.com.matthewprenger:CurseGradle:1.4.0'
	}
}

plugins {
	id "org.jetbrains.gradle.plugin.idea-ext"
	id "gg.essential.loom"
	id "com.gradleup.shadow"
	id "org.jetbrains.changelog"
}
if (System.getenv("MODRINTH_TOKEN")) {
	apply plugin: "com.modrinth.minotaur"
}
if (System.getenv("CURSEFORGE_TOKEN")) {
	apply plugin: "com.matthewprenger.cursegradle"
}
evaluationDependsOn ':xplat'

//architectury {
//	platformSetupLoomIde()
//	forge()
//}

loom {
//	accessWidenerPath = project(":xplat").loom.accessWidenerPath

//	mods {
//		main {
//			sourceSet project(':xplat').sourceSets.main
//		}
//	}

	forge {
//		convertAccessWideners = true
//		extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

		pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
		accessTransformer(rootProject.file("xplat/src/main/resources/${access_transformer_locations}"))
		accessTransformer(provider {
			zipTree(configurations.jeiAt.singleFile).matching { include 'META-INF/jei_at.cfg' }.singleFile
		})

//		mixinConfig "emi.mixins.json"
//		mixinConfig "emi-forge.mixins.json"
	}

	mixin {
		defaultRefmapName.set(mixin_refmap)
	}

	runs {
		client {
			property('fml.coreMods.load', coremod_plugin_class_name)
			mixin_configs.split(' ').each { programArgs('--mixin', it) }
		}
		server {
			property('fml.coreMods.load', coremod_plugin_class_name)
			mixin_configs.split(' ').each { programArgs('--mixin', it) }
		}
	}
}

configurations {
	devMods
	jeiAt

//	common
//	shadowCommon
//	compileClasspath.extendsFrom common
//	runtimeClasspath.extendsFrom common
//	developmentForge.extendsFrom common
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings "de.oceanlabs.mcp:mcp_stable:${rootProject.mapping_version}-1.12"

	forge "net.minecraftforge:forge:${rootProject.forge_version}"

	implementation project(':xplat')
//	common(project(path: ":xplat", configuration: "namedElements")) { transitive = false }
//	shadowCommon(project(path: ":xplat", configuration: "transformProductionForge")) { transitive = false }

	modCompileOnly("mezz.jei:${rootProject.jei_version}") {
		transitive = false
	}
	compileOnly "org.spongepowered:mixin:0.8.5-SNAPSHOT"

	annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
	annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'

	devMods 'zone.rong:mixinbooter:10.7'
	jeiAt "mezz.jei:${jei_version}"
	runtimeOnly "mezz.jei:${jei_version}"
}

sourceSets.main.output.resourcesDir = file('build/classes/java/main')

processResources {
	inputs.property "version", project.version

	filesMatching("mcmod.info") {
		expand "version": project.version
	}

	from project(':xplat').sourceSets.main.output.classesDirs
	from project(':xplat').tasks.named('processResources')
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from project(':xplat').sourceSets.main.output

	manifest {
		def attribute_map = [:]
		attribute_map['FMLCorePlugin'] = coremod_plugin_class_name
		attribute_map['FMLCorePluginContainsFMLMod'] = true
		attribute_map['FMLAT'] = access_transformer_locations
		attribute_map['MixinConfigs'] = mixin_configs.split(' ').join(',')
		attributes(attribute_map)
	}
}

