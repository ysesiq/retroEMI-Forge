['runClient', 'runServer', 'runObfClient', 'runObfServer', 'runVanillaClient', 'runVanillaServer'].each { taskName ->
	def task = tasks.findByName(taskName)
	if (task != null) {
		task.configure { enabled = false }
	}
}

tasks.withType(JavaForkOptions).configureEach {
	setJvmArgs([])
}
