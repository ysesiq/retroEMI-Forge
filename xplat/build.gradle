/**
 * Platform-neutral sources: the EMI port itself and every mixin.
 * Compiled against Minecraft (via Essential Loom) and consumed by `forge`.
 */
plugins {
	id 'java'
	id 'java-library'
	id 'gg.essential.loom'
}

apply from: rootProject.file('gradle/scripts/helpers.gradle')

base {
	archivesName.set("${propertyString('mod_id')}-xplat")
}

loom {
	forge {
		pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
		accessTransformer(rootProject.file("xplat/src/main/resources/${propertyString('access_transformer_locations')}"))
	}
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName.set(propertyString('mixin_refmap'))
	}
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(16))
		vendor.set(JvmVendorSpec.AZUL)
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings "de.oceanlabs.mcp:mcp_stable:${propertyString('mapping_version')}-1.12"
	forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	compileOnly 'org.jetbrains:annotations:26.1.0'
	compileOnly 'org.jspecify:jspecify:1.0.0'
	compileOnly "mezz.jei:${jei_version}"
	// Mixin runtime + booter APIs (ILateMixinLoader / @MixinLoader)
	compileOnly "org.spongepowered:mixin:0.8.5-SNAPSHOT"
	compileOnly "zone.rong:mixinbooter:${propertyString('mixin_booter_version')}"

	annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
	// Workaround for https://github.com/bsideup/jabel/issues/174
	annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'
	// Registers MixinExtras' injectors with the Mixin AP so @WrapOperation targets land in the refmap
	annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
	compileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
		transitive = false
	}
}

tasks.withType(JavaCompile).configureEach {
	sourceCompatibility = 17
	options.release.set(8)
	javaCompiler.set(javaToolchains.compilerFor {
		languageVersion.set(JavaLanguageVersion.of(16))
		vendor.set(JvmVendorSpec.AZUL)
	})
}

// All mod resources live here: the mixin configs, the Access Transformer, mcmod.info and the assets.
// `forge` merges this task's output into the deployable jar.
processResources {
	filesMatching(['mcmod.info', 'pack.mcmeta', 'mixins.*(?!refmap).*\\.json']) {
		def authors = propertyString('mod_authors').split(',').collect { """\"${ it.trim() }\"""" }.join(', ')
		expand(
				'mod_id': propertyString('mod_id'),
				'mod_name': propertyString('mod_name'),
				'mod_version': propertyString('mod_version'),
				'mod_description': propertyString('mod_description'),
				'mod_authors': "[${authors}]",
				'mod_credits': propertyString('mod_credits'),
				'mod_url': propertyString('mod_url'),
				'mod_update_json': propertyString('mod_update_json'),
				'mod_logo_path': propertyString('mod_logo_path'),
				'mixin_refmap': propertyString('mixin_refmap'),
				'mixin_package': propertyString('mixin_package')
		)
	}

	rename '(.+_at.cfg)', 'META-INF/$1'
}

// A bare `./gradlew runClient` from the root runs the task in every subproject that has it,
// which would launch the game twice. Only `forge` is allowed to start the client/server.
['runClient', 'runServer', 'runObfClient', 'runObfServer', 'runVanillaClient', 'runVanillaServer'].each { taskName ->
	def task = tasks.findByName(taskName)
	if (task != null) {
		task.configure { enabled = false }
	}
}

tasks.withType(JavaForkOptions).configureEach {
	setJvmArgs([])
}
